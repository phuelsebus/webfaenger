[project]
name = "webfaenger"
version = "1.0.0"
description = "Leichtgewichtiger Desktop-Downloader für Bilder von Webseiten"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pywebview>=6"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
